@property --stroke-angle{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{
  /* SuccessFactors (Horizon) — sampled from the reference screenshot */
  --sf-shell:#0e0e36; --sf-shell-tint:#1d1550; --sf-search:#111049; --sf-search-border:#2a3060;
  --sf-bg:#f3f5f6; --sf-card:#fff; --sf-text:#1a2835; --sf-title:#131c24; --sf-label:#496075;
  --sf-link:#005ace; --sf-border:#d4d4d4; --sf-soft:#e5e8ea;
  /* WalkMe CUA tokens (from the LoanDesk prototype) */
  --cua-violet:#5f38ff; --cua-violet-ring:#5f38ff59; --cua-blue:#2f5fe8;
  --text-dark:#131e29; --text-primary:#2f426c; --text-secondary:#616f8f;
  --font:"72",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--sf-text);background:var(--sf-bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ===================== Demo state toggles ===================== */
.toggles{position:fixed;top:0;left:0;right:0;height:40px;background:#131e29;color:#fff;display:flex;align-items:center;gap:28px;padding:0 24px;z-index:60;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;box-shadow:0 1px 0 #ffffff14}
.toggles__label{opacity:.55;text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:700}
.toggles label{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-weight:600}
.toggles input{width:16px;height:16px;accent-color:var(--cua-violet);cursor:pointer;margin:0}
.toggles small{opacity:.55;font-weight:400}
.toggles__hint{margin-left:auto;opacity:.5;font-size:11px}

/* ===================== SuccessFactors shell ===================== */
.shell{position:fixed;top:40px;left:0;right:0;height:52px;background:var(--sf-shell);display:flex;align-items:center;padding:0 48px 0 58px;z-index:50;transition:background .5s}
.shell.is-tint{background:var(--sf-shell-tint)}
.shell__logo{display:flex;align-items:center;height:40px}
.shell__app{color:#fff;font-weight:700;font-size:16px;margin-left:34px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.shell__search{position:absolute;left:50%;transform:translateX(-50%);width:560px;max-width:34vw;height:36px;border-radius:18px;background:var(--sf-search);border:1px solid var(--sf-search-border);display:flex;align-items:center;padding:0 14px;color:#fff;font-style:italic;font-size:14px;white-space:nowrap;overflow:hidden}
.shell__right{margin-left:auto;display:flex;align-items:center;gap:24px}
.shell__ico{color:#fff;display:flex;position:relative}
.shell__badge{position:absolute;top:-8px;right:-8px;background:#d3393d;color:#fff;font-size:10px;font-weight:700;border-radius:8px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0;overflow:hidden}
.avatar--me{width:32px;height:32px;background:linear-gradient(135deg,#c76b5a,#7d3b2f);font-size:12px;box-shadow:0 0 0 2px #fff}

/* ===================== Object page ===================== */
#scroller{position:fixed;top:92px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden}
#scroller::-webkit-scrollbar{width:10px}
#scroller::-webkit-scrollbar-thumb{background:#7d8a96;border-radius:6px;border:2px solid var(--sf-bg)}
.op-head{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--sf-border)}
.op-head__inner{padding:18px 47px 0;position:relative}
.crumbs{font-size:14px;color:var(--sf-label);display:flex;gap:5px}
.crumbs a{color:var(--sf-link);text-decoration:none;cursor:pointer}
.op-title{font-size:20px;font-weight:700;color:var(--sf-title);margin:20px 0 8px}
.op-person{display:flex;align-items:center;gap:14px;margin-left:16px;height:34px}
.op-person .avatar{width:32px;height:32px;font-size:12px;background:linear-gradient(135deg,#9db7d8,#4f6f99)}
.op-person__name{font-weight:700;font-size:14px;color:var(--sf-text);display:flex;align-items:center;gap:8px}
.idcard{color:var(--sf-link);display:inline-flex}
.asof{position:absolute;right:47px;top:43px;display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 9px;border:1px solid var(--sf-link);border-radius:8px;background:#fff;color:var(--sf-link);font-weight:700;font-size:14px;cursor:pointer}
.collapse{display:flex;align-items:center;justify-content:center;margin-top:-10px;height:24px}
.collapse__line{width:46px;height:1px;background:var(--sf-soft)}
.collapse__btn{width:24px;height:24px;border-radius:50%;border:1px solid #bcc4ca;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--sf-link)}
.tabs{display:flex;gap:0;padding:0 47px;margin-top:6px}
.tab{position:relative;background:none;border:none;padding:10px 3px 12px;margin-right:36px;font-size:14px;font-weight:700;color:var(--sf-text);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--sf-link)}
.tab.is-active{color:var(--sf-link)}
.tab.is-active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--sf-link)}

.sections{padding:0 47px}
.section{padding-top:4px}
.section__title{position:sticky;z-index:10;top:var(--stick,175px);background:var(--sf-bg);font-size:20px;font-weight:700;color:var(--sf-title);margin:0;padding:22px 0 14px}
.card{background:#fff;border-radius:12px;padding:20px 16px 18px;box-shadow:0 0 1px #0000001a}
.fields{display:grid;grid-template-columns:repeat(3,1fr);row-gap:14px;column-gap:24px}
.field__label{font-size:14px;color:var(--sf-label);margin-bottom:6px}
.field__lbl{display:inline-block;border-radius:6px;transition:box-shadow .3s,background .3s}
.field__value{font-size:14px;color:var(--sf-text);display:inline-block;border-radius:6px;transition:box-shadow .3s,background .3s}
.person{display:flex;align-items:center;gap:12px}
.person .avatar{width:48px;height:48px;font-size:15px;background:linear-gradient(135deg,#b9c8d8,#5f7891)}
.person__name{color:var(--sf-link);font-size:14px;display:flex;align-items:center;gap:20px}
.person__role{font-size:14px;color:var(--sf-text);margin-top:6px}
.show-empty{display:flex;justify-content:flex-end;padding:10px 0 4px}
.show-empty a{color:var(--sf-link);font-size:14px;cursor:pointer}
.subhead{font-size:16px;font-weight:700;color:var(--sf-title);margin:20px 0 10px}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:700;color:var(--sf-label);padding:10px 12px;border-bottom:1px solid var(--sf-border);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid #eef0f2;color:var(--sf-text)}
.tbl tr:last-child td{border-bottom:none}
.tbl td span{display:inline-block;border-radius:6px;padding:2px 6px;margin:-2px -6px;transition:box-shadow .3s,background .3s}
.tbl th span{display:inline-block;border-radius:6px;padding:2px 6px;margin:-2px -6px}

/* lazy loader */
.loader{height:260px;display:flex;align-items:flex-start;justify-content:center;padding-top:40px}
.busy{display:flex;gap:6px}
.busy i{width:10px;height:10px;border-radius:50%;background:var(--sf-link);animation:busy 1.2s ease-in-out infinite;display:block}
.busy i:nth-child(2){animation-delay:.2s}.busy i:nth-child(3){animation-delay:.4s}
@keyframes busy{0%,80%,100%{transform:scale(.4);opacity:.35}40%{transform:scale(1);opacity:1}}
.page-end{height:320px}
.section--in{animation:sec-in .5s cubic-bezier(.2,.7,.3,1)}
@keyframes sec-in{0%{opacity:0;transform:translateY(14px)}}
.sk{display:inline-block;height:14px;border-radius:7px;background:linear-gradient(90deg,#eceff1 0%,#f7f8f9 50%,#eceff1 100%);background-size:200% 100%;animation:sk 1.1s linear infinite;vertical-align:middle}
@keyframes sk{to{background-position:-200% 0}}
.value-in{animation:val-in .45s ease-out}
@keyframes val-in{0%{opacity:0}}

.fab{position:fixed;left:14px;bottom:20px;width:46px;height:46px;border-radius:50%;background:#232426;border:1px solid #4a4c50;display:flex;align-items:center;justify-content:center;z-index:30;box-shadow:0 2px 6px #0004}

/* found-element highlight (3d only) */
.cap{position:relative;outline:2px dashed #5f38ff;outline-offset:3px}
.cap:after{content:attr(data-cap);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);white-space:nowrap;background:#5f38ff;color:#fff;font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.cap--above:after{left:auto;right:calc(100% + 12px)}
.cua-found{box-shadow:0 0 0 2px var(--cua-violet),0 0 0 6px #5f38ff26!important;background:#f3efff!important}

/* ===================== WalkMe overlays ===================== */
.glow{position:fixed;inset:40px 0 0;pointer-events:none;z-index:40;background:radial-gradient(560px 380px at 0 0,#5f38ff24,#0000 70%),radial-gradient(560px 380px at 100% 0,#5f38ff24,#0000 70%),radial-gradient(700px 420px at 0 100%,#5f38ff1a,#0000 70%),radial-gradient(700px 420px at 100% 100%,#5f38ff1a,#0000 70%);animation:fade .4s both}
@keyframes fade{0%{opacity:0}}

/* SWT balloon (matches the LoanDesk screenshot) */
.balloon{position:fixed;z-index:900;width:360px;background:#fff;border-radius:14px;box-shadow:0 10px 34px -6px #1b2a4e40,0 2px 6px #0000001a;padding:22px 22px 18px 24px;font-family:var(--font);animation:bal-in .25s cubic-bezier(.2,.7,.3,1)}
@keyframes bal-in{0%{opacity:0;transform:translateY(6px) scale(.97)}}
.balloon__x{position:absolute;top:16px;right:16px;border:none;background:none;color:#5b6577;cursor:pointer;padding:4px;border-radius:6px;display:flex}
.balloon__x:hover{background:#f0f2f5}
.balloon__title{font-size:18px;font-weight:700;color:#24375a;margin:0 32px 12px 0;line-height:1.3}
.balloon__body{font-size:15px;line-height:1.5;color:#2c3440;margin:0}
.balloon__foot{display:flex;justify-content:flex-end;margin-top:20px}
.balloon__next{background:#2f5fe8;color:#fff;border:none;border-radius:999px;height:40px;padding:0 26px;font-size:15px;font-weight:700;cursor:pointer}
.balloon__next:hover{background:#2552d6}
.balloon__tail{position:absolute;width:16px;height:16px;background:#fff;transform:rotate(45deg)}
.balloon--below .balloon__tail{top:-8px;box-shadow:-2px -2px 3px -2px #00000014}
.balloon--above .balloon__tail{bottom:-8px;box-shadow:3px 3px 3px -2px #00000014}
.balloon--right .balloon__tail{left:-8px;box-shadow:-2px 2px 3px -2px #00000014}
.balloon--left .balloon__tail{right:-8px;box-shadow:2px -2px 3px -2px #00000014}

/* CUA narrator card (light purple, rotating stroke) */
.ccard{position:fixed;z-index:950;width:440px;border-radius:14px;padding:22px 24px 20px;background:linear-gradient(#f7f7ff 0%,#ededff 100%);box-shadow:0 0 4px #5f38ff99,14px 20px 40px -12px #7070b059;font-family:var(--font);animation:card-in .3s cubic-bezier(.2,.7,.3,1)}
.ccard:before{content:"";position:absolute;inset:-1.5px;border-radius:inherit;padding:1.5px;pointer-events:none;background:conic-gradient(from var(--stroke-angle),transparent 0deg,transparent 260deg,var(--cua-violet) 320deg,#b8a4ff 340deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:stroke 2.6s linear infinite}
@keyframes stroke{to{--stroke-angle:360deg}}
@keyframes card-in{0%{opacity:0;transform:var(--from,translate(0,8px)) scale(.97)}}
.ccard--center{left:50%;top:46%;transform:translate(-50%,-50%);--from:translate(-50%,calc(-50% + 8px))}
.ccard--bl{left:24px;bottom:24px;width:420px}
.ccard__head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.ccard__title{margin:0;font-size:21px;font-weight:700;color:var(--text-dark);line-height:1.3}
.ccard__stop{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--cua-violet);background:transparent;color:var(--cua-violet);display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:2px}
.ccard__stop:hover{background:#5f38ff1a}
.ccard__disc{margin:14px 0 0;font-size:14px;line-height:1.45;color:var(--text-secondary)}
.ccard__disc a{color:var(--cua-blue);text-decoration:none}
.ccard__body{margin:10px 0 0;font-size:15px;line-height:1.45;color:var(--text-primary)}
.ccard__actions{display:flex;justify-content:flex-end;gap:16px;margin-top:18px}
.cbtn{height:34px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid #385feb33;background:#385feb17;color:#385feb}
.cbtn--text{background:none;border:none;color:var(--text-secondary)}
.scrim{position:fixed;inset:0;background:#223548b3;z-index:960;animation:fade .2s both}
.ccard.is-modal{z-index:970}

/* CUA cursor */
.cursor{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;transition:transform 1.1s cubic-bezier(.65,0,.35,1);will-change:transform}
.cursor__glyph{width:34px;height:34px;filter:drop-shadow(0 2px 4px #00000059)}
.cursor__pill{position:absolute;top:34px;left:24px;white-space:nowrap;background:var(--cua-violet);color:#fff;border:2px solid #fff;border-radius:14px;padding:9px 16px;font-size:17px;font-weight:600;box-shadow:0 0 0 2px #5f38ff80,0 6px 10px #00000040;overflow:hidden;animation:pill-in .26s ease-out}
.cursor__pill:after{content:"";position:absolute;left:0;bottom:0;height:3px;width:40%;background:#2a128f;animation:pill-bar 1.6s ease-in-out infinite}
@keyframes pill-bar{0%{left:-40%}100%{left:100%}}
@keyframes pill-in{0%{opacity:0;transform:translateY(4px) scale(.96)}}
.cursor.is-pulsing .cursor__glyph{animation:pulse 1.4s ease-out infinite;border-radius:50%}
@keyframes pulse{0%{filter:drop-shadow(0 0 0 #5f38ffaa)}70%{filter:drop-shadow(0 0 10px #5f38ff00)}100%{filter:drop-shadow(0 2px 4px #00000059)}}

/* ===================== Presenter controls ===================== */
.ctl{position:fixed;right:16px;bottom:16px;z-index:2000;width:340px;background:#131e29;color:#fff;border-radius:12px;box-shadow:0 10px 30px #0006;font-size:13px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;transition:opacity .2s}
.ctl.is-min .ctl__body{display:none}
.ctl__bar{display:flex;align-items:center;gap:8px;padding:10px 12px}
.ctl__label{opacity:.55;text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:700}
.ctl__phase{margin-left:auto;background:#ffffff1a;border-radius:5px;padding:3px 8px;font-family:ui-monospace,monospace;font-size:11px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl__icon{background:none;border:none;color:#fff9;cursor:pointer;font-size:14px;padding:2px 4px}
.ctl__body{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:#ffffff12;border-radius:8px;padding:3px;gap:2px}
.seg button{flex:1;background:none;border:none;color:#fffa;border-radius:6px;padding:6px 6px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button.is-on{background:var(--cua-violet);color:#fff}
.seg button:disabled{opacity:.45;cursor:default}
.ctl__row{display:flex;flex-direction:column;gap:5px}
.ctl__run{background:#1677ff;color:#fff;border:none;border-radius:8px;padding:9px;font-size:13px;font-weight:700;cursor:pointer}
.ctl__run.is-restart{background:var(--cua-violet)}
.notes{background:#ffffff0d;border-radius:8px;padding:10px 11px;line-height:1.45;font-size:12px}
.notes b{display:block;color:#b8a4ff;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.notes b:first-child{margin-top:0}
.notes code{background:#ffffff1a;border-radius:4px;padding:1px 5px;font-family:ui-monospace,monospace;font-size:11px}
.notes .pick{color:#7fe0a6}
.kbd{opacity:.5;font-size:11px}
</style>
</head>
<body>

<div class="toggles" id="toggles">

<div class="fab" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19l-4 1z" stroke="#4fd36b" stroke-width="1.9" stroke-linejoin="round"/><path d="M14.5 6.5l3 3" stroke="#4fd36b" stroke-width="1.9"/></svg></div>
<div id="overlay"></div>

<script>
/* =====================================================================

     1) Lazy-loaded content  2) Language (French UI)  3) Tables
   The CUA never clicks or navigates — it only scrolls and looks.
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const scroller = $("#scroller"), sectionsEl = $("#sections"), tailEl = $("#tail"), overlay = $("#overlay");
const AI_TERMS = "https://www.walkme.com/walkme-ai-terms/";

const TIMING = {

  RECONNECT: 1900,    // 3d  Reconnecting
};

/* ---------------- i18n ---------------- */

const SUP = { name: "Amit Shalev", initials: "AS", role: { en: "Software Developer Team Lead", fr: "Chef d'équipe développement logiciel" } };

// [id, EN label, FR label, EN value, FR value]
const FIELDS = {

const EMPTY_COUNT = { position: 2, organization: 1, job: 3, time: 2 };
const JH_COLS = [["date", "Effective Date", "Date d'effet"], ["event", "Event", "Événement"], ["reason", "Event Reason", "Motif"], ["pos", "Position", "Poste"], ["mgr", "Manager", "Responsable"]];

const SECTION_ORDER = ["position", "organization", "job", "time"];
// At capture time the table had no "Promotion" row yet; the "Sort table" checkbox adds it on top
const jhRows = () => S.flags.table ? JH_ROWS : JH_ROWS.slice(1);

/* ---------------- icons ---------------- */
const I = {

  bell: `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 14V9a5 5 0 0110 0v5l1.5 1.5h-13L5 14z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.2 17.5a2 2 0 003.6 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  x: `<svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  stop: `<svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" rx="2" fill="currentColor"/></svg>`,
  arrow: `<svg class="cursor__glyph" viewBox="0 0 30 30" fill="none"><path d="M4 2.5L25.5 14.2L15.7 16.6L10.9 26.5L4 2.5Z" fill="#5f38ff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
  logo: `<svg width="124" height="40" viewBox="0 0 124 40" fill="none"><text x="0" y="29" fill="#fff" font-family="Arial Rounded MT Bold,Nunito,Arial,sans-serif" font-weight="700" font-size="30" letter-spacing="-1">walk</text><path d="M76 6h34a10 10 0 0110 10v8a10 10 0 01-10 10H92l-6 5v-5h-10a10 10 0 01-10-10v-8a10 10 0 0110-10z" fill="#fff"/><text x="74.5" y="29" fill="#0e0e36" font-family="Arial Rounded MT Bold,Nunito,Arial,sans-serif" font-weight="700" font-size="27" letter-spacing="-1">me</text></svg>`,

/* ---------------- use-case scenarios ---------------- */
const SCENARIOS = {
  scroll: {
    short: "① Lazy load", lang: "en",
    start: { loaded: ["position", "organization"], scrollTo: null },
    swtName: "Check my work schedule",
    step1: { target: "asof", title: "Check today's job data", body: "Make sure the view is set to As of Today, so you see your current job and time details." },

  },
  lang: {

    start: { loaded: SECTION_ORDER, scrollTo: "job" },
    swtName: "Check my remote-work status",
    step1: { target: "asof", title: "Check today's job data", body: "Make sure the view is set to As of Today, so you see your current job details." },

    notes: () => `<b>SWT step 2 expects</b>Recorded in English: the label <code>Work From Home</code>.

  },
  table: {

    start: { loaded: SECTION_ORDER, scrollTo: "job" },

    step2: (prio) => prio === "location"
      ? { target: "c-0-event", title: "Your most recent job event", body: "This is the latest change to your job record. Open it to see the details.", btn: "Done" }
      : { target: `c-${S.flags.table ? 3 : 2}-event`, title: "Your hire event", body: "This is where your job history starts: the day you were hired.", btn: "Done" },
    captured: (prio) => `<b>What was captured</b>Step 2 → a cell in the <code>Event</code> column of Job History, with the step prompt:
      <span class="${prio === "location" ? "pick" : ""}">${prio === "location" ? "▶ " : ""}Location: "the first cell in column <i>Event</i>" → <code>Data Change</code></span><br>
      <span class="${prio === "text" ? "pick" : ""}">${prio === "text" ? "▶ " : ""}Text: "the cell containing <i>Hire</i> in column <i>Event</i>" → <code>Hire</code></span>

    notes: (prio) => `<b>SWT step 2 expects</b>A cell in the <code>Event</code> column of the Job History table.
      <b>What's on screen</b>DeepUI can't detect the first cell under a table header, so the step isn't found. A new <code>Promotion</code> row has also been added on top.
      <b>Step prompt: what to prioritize</b>
      <span class="${prio === "location" ? "pick" : ""}">${prio === "location" ? "▶ " : ""}Location: "the first cell in column <i>Event</i>" → <code>Promotion</code></span><br>
      <span class="${prio === "text" ? "pick" : ""}">${prio === "text" ? "▶ " : ""}Text: "the cell containing <i>Hire</i> in column <i>Event</i>" → <code>Hire</code></span>
      <b>How self-healing recovers</b>The agent reads the header, follows the column, picks the cell the prompt asks for, and the SWT reconnects there.`,
  },
};

/* ---------------- state ---------------- */
const S = { uc: "scroll", prio: "location", phase: "idle", lang: "en", loaded: [], loading: false, min: true, flags: { lazy: false, lang: false, table: false } };
const FLAGS_KEY = "sf-demo-flags";
try { Object.assign(S.flags, JSON.parse(localStorage.getItem(FLAGS_KEY) || "{}")); } catch (e) {}
// The panel's State (Original / Off / On) is kept per use case; S.mode reads/writes the one for the selected use case
const FLAG_OF_UC = { scroll: "lazy", lang: "lang", table: "table" };
S.modes = Object.fromEntries(Object.entries(FLAG_OF_UC).map(([uc, f]) => [uc, S.flags[f] ? "on" : "orig"]));
Object.defineProperty(S, "mode", { get() { return S.modes[S.uc]; }, set(v) { S.modes[S.uc] = v; } });
const LAZY_START = ["position", "organization"]; // cards present before any scrolling when lazy load is on
let runId = 0, stopped = false, paused = false, waiters = [], nextResolve = null;
let balloon = null; // {target, el}
const t = (k) => STR[S.lang][k];
const L = (row) => S.lang === "fr" ? row[2] : row[1];
const V = (row) => S.lang === "fr" ? row[4] : row[3];

/* ---------------- render: shell + object-page header ---------------- */
function renderShell() {
  $("#shell").innerHTML = `
    <div class="shell__logo">${I.logo}</div>
    <div class="shell__app">${t("app")} ${I.chevDown("#fff", 13)}</div>
    <div class="shell__search">${t("search")}</div>
    <div class="shell__right">
      <span class="shell__ico">${I.check}</span>
      <span class="shell__ico">${I.chat}</span>
      <span class="shell__ico">${I.bell}<span class="shell__badge">8</span></span>
      <span class="avatar avatar--me">${EMP.initials}</span>
    </div>`;
  const bc = t("bc");
  $("#ophead").innerHTML = `
    <div class="op-head__inner">
      <div class="crumbs"><a>${bc[0]}</a><span>/</span><a>${bc[1]}</a><span>/</span><span>${bc[2]}</span></div>
      <h1 class="op-title">${t("title")}</h1>
      <div class="op-person"><span class="avatar">${EMP.initials}</span><span class="op-person__name">${EMP.name} <span class="idcard">${I.idcard}</span></span></div>
      <button class="asof" data-id="asof">${I.cal} ${t("asof")}</button>
    </div>
    <div class="collapse"><span class="collapse__line"></span><span class="collapse__btn">${I.chevDown("#005ace", 12)}</span><span class="collapse__line"></span></div>
    <div class="tabs">${SECTION_ORDER.map((s) => `<button class="tab" data-tab="${s}">${t("tabs")[s]}</button>`).join("")}</div>`;
  document.documentElement.lang = S.lang;
  $("#ophead").querySelectorAll(".tab").forEach((b) => b.onclick = () => userGoToTab(b.dataset.tab));
}

/* ---------------- render: sections ---------------- */
function fieldHTML(row, skeleton) {
  const [id] = row;
  let val;
  if (id === "sup") {
    val = `<div class="person"><span class="avatar">${SUP.initials}</span><div><div class="person__name">${SUP.name} <span class="idcard">${I.idcard}</span></div><div class="person__role">${SUP.role[S.lang]}</div></div></div>`;
    return `<div class="field" style="grid-row:span 1"><div class="field__label">${L(row)}:</div>${val}</div>`;
  }
  val = skeleton ? `<span class="sk" style="width:${110 + (id.length * 13) % 90}px"></span>` : V(row);
  return `<div class="field"><div class="field__label"><span class="field__lbl" data-id="l-${id}">${L(row)}</span>:</div><span class="field__value" data-id="v-${id}">${val}</span></div>`;
}
function jobHistoryHTML() {
  const fr = S.lang === "fr";
  return `<h3 class="subhead" data-id="jh-title" style="display:inline-block">${t("jobHistory")}</h3>
    <div class="card" style="padding:6px 16px 6px">
      <table class="tbl"><thead><tr>${JH_COLS.map((c) => `<th><span data-id="h-${c[0]}">${fr ? c[2] : c[1]}</span></th>`).join("")}</tr></thead>
      <tbody>${jhRows().map((r, i) => `<tr>${r.map((v, j) => `<td><span data-id="c-${i}-${JH_COLS[j][0]}">${v}</span></td>`).join("")}</tr>`).join("")}</tbody></table>
    </div>`;
}
function sectionHTML(key, { skeleton = false } = {}) {
  const rows = FIELDS[key];
  return `<section class="section" data-sec="${key}">
      <h2 class="section__title">${t("tabs")[key]}</h2>
      <div class="card"><div class="fields">${rows.map((r) => fieldHTML(r, skeleton)).join("")}</div></div>
      <div class="show-empty"><a>${t("showEmpty")} (${EMPTY_COUNT[key]})</a></div>
      ${key === "job" ? jobHistoryHTML() : ""}
    </section>`;
}
function appendSection(key, opts = {}) {
  const wrap = document.createElement("div");
  wrap.innerHTML = sectionHTML(key, opts);
  const sec = wrap.firstElementChild;
  if (opts.animate) sec.classList.add("section--in");
  sectionsEl.appendChild(sec);
  S.loaded.push(key);
  renderTail();
  return sec;
}
function renderTail() {
  const more = S.loaded.length < SECTION_ORDER.length;
  tailEl.innerHTML = more ? `<div class="loader" id="loader"><div class="busy" ${S.loading ? "" : 'style="visibility:hidden"'}><i></i><i></i><i></i></div></div>` : `<div class="page-end"></div>`;
}
function stickTop() { return $("#ophead").offsetHeight; }
function updateStick() { document.documentElement.style.setProperty("--stick", stickTop() + "px"); }

/* lazy loading on scroll */
function nearBottom() {
  const ld = $("#loader"); if (!ld) return false;
  return ld.getBoundingClientRect().top < window.innerHeight + 10;
}
function maybeLoadMore() {
  if (S.loading || !S.flags.lazy || S.loaded.length >= SECTION_ORDER.length || !nearBottom()) return;
  S.loading = true; renderTail();
  const key = SECTION_ORDER[S.loaded.length], myRun = runId;
  setTimeout(() => {
    if (myRun !== runId) return;
    S.loading = false;
    const late = key === "time";
    const sec = appendSection(key, { animate: true, skeleton: late });
    if (late) setTimeout(() => {
      if (myRun !== runId) return;
      FIELDS.time.forEach((r) => { const el = sec.querySelector(`[data-id="v-${r[0]}"]`); if (el) { el.innerHTML = V(r); el.classList.add("value-in"); } });
    }, TIMING.SKELETON);
    spy();
  }, TIMING.LOAD);
}

/* scroll-spy: the card that reaches the sticky header selects its tab */
function spy() {
  const line = scroller.getBoundingClientRect().top + stickTop() + 60;
  let active = S.loaded[0];
  sectionsEl.querySelectorAll(".section").forEach((s) => { if (s.getBoundingClientRect().top <= line) active = s.dataset.sec; });
  if (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2 && S.loaded.length === SECTION_ORDER.length) active = S.loaded[S.loaded.length - 1];
  $("#ophead").querySelectorAll(".tab").forEach((b) => b.classList.toggle("is-active", b.dataset.tab === active));
}
function sectionScrollTop(key) {
  const s = sectionsEl.querySelector(`[data-sec="${key}"]`); if (!s) return 0;
  return s.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop - stickTop();
}
function userGoToTab(key) { if (S.loaded.includes(key)) scroller.scrollTo({ top: sectionScrollTop(key) + 2, behavior: "smooth" }); }
scroller.addEventListener("scroll", () => { spy(); maybeLoadMore(); placeBalloon(); });
window.addEventListener("resize", () => { updateStick(); placeBalloon(); });

/* ---------------- build page for the selected use case ---------------- */
// keep = { sec, offset }: rebuild the page but stay where the user is (section + offset within it)
function buildPage(keep = null) {
  const sc = SCENARIOS[S.uc];
  S.lang = S.flags.lang ? "fr" : "en"; S.loaded = []; S.loading = false;
  sectionsEl.innerHTML = "";
  renderShell(); updateStick();
  let initial = S.flags.lazy ? LAZY_START : SECTION_ORDER;
  if (keep && S.flags.lazy) initial = SECTION_ORDER.slice(0, Math.max(LAZY_START.length, SECTION_ORDER.indexOf(keep.sec) + 1));
  initial.forEach((k) => appendSection(k));
  scroller.scrollTop = 0;
  if (keep) scroller.scrollTop = sectionScrollTop(keep.sec) + keep.offset;
  else if (sc.start.scrollTo && S.loaded.includes(sc.start.scrollTo)) scroller.scrollTop = sectionScrollTop(sc.start.scrollTo) + 2;
  spy(); renderToggles();
}
function currentPosition() {
  const sec = $("#ophead .tab.is-active")?.dataset.tab || S.loaded[0];
  return { sec, offset: scroller.scrollTop - sectionScrollTop(sec) };
}

/* ---------------- overlay primitives ---------------- */
const el = (id) => document.querySelector(`[data-id="${id}"]`);
const rectOf = (id) => el(id)?.getBoundingClientRect();
function setGlow(on) {
  $("#shell").classList.toggle("is-tint", on);
  const g = $(".glow");
  if (on && !g) { const d = document.createElement("div"); d.className = "glow"; document.body.appendChild(d); }
  if (!on && g) g.remove();
}
/* cursor */
let cursorEl = null;
function cursor(x, y, label, pulsing = false) {
  if (!cursorEl) { cursorEl = document.createElement("div"); cursorEl.className = "cursor"; cursorEl.style.transition = "none"; cursorEl.style.transform = `translate(${x}px,${y}px)`; document.body.appendChild(cursorEl); void cursorEl.offsetWidth; cursorEl.style.transition = ""; }
  cursorEl.style.transform = `translate(${Math.round(x)}px,${Math.round(y)}px)`;
  cursorEl.classList.toggle("is-pulsing", pulsing);
  const cur = cursorEl.querySelector(".cursor__pill")?.textContent;
  if (cur !== label) cursorEl.innerHTML = I.arrow + (label ? `<div class="cursor__pill">${label}</div>` : "");
}
function cursorToEl(id, label, pulsing) { const r = rectOf(id); if (r) cursor(r.left + Math.min(r.width * 0.55, 60), r.top + r.height * 0.55, label, pulsing); }
function hideCursor() { cursorEl?.remove(); cursorEl = null; }
/* narrator card */
function card(place, title) {
  $("#overlay .ccard:not(.is-modal)")?.remove();
  if (!title) return;
  const d = document.createElement("div");
  d.className = `ccard ccard--${place}`;
  d.innerHTML = `<div class="ccard__head"><h3 class="ccard__title">${title}</h3><button class="ccard__stop" title="Pause returning to the original flow" aria-label="Pause">${I.stop}</button></div>
    <p class="ccard__disc">This feature uses AI under <a href="${AI_TERMS}" target="_blank" rel="noopener">WalkMe AI Terms</a>. You can pause at any time.</p>`;
  d.querySelector(".ccard__stop").onclick = requestStop;
  overlay.appendChild(d);
}
/* SWT balloon */
function showBalloon(cfg) {
  hideBalloon();
  const d = document.createElement("div");
  d.className = "balloon";
  d.innerHTML = `<button class="balloon__x" aria-label="Close">${I.x}</button><h4 class="balloon__title">${cfg.title}</h4><p class="balloon__body">${cfg.body}</p>
    <div class="balloon__foot"><button class="balloon__next">${cfg.btn || "Next"}</button></div><span class="balloon__tail"></span>`;
  d.querySelector(".balloon__next").onclick = () => clickNext();
  d.querySelector(".balloon__x").onclick = () => { hideBalloon(); setPhase("closed by user"); };
  overlay.appendChild(d);
  balloon = { target: cfg.target, el: d, side: cfg.side };
  placeBalloon();
}
function hideBalloon() { balloon?.el.remove(); balloon = null; }
function placeBalloon() {
  if (!balloon) return;
  const r = rectOf(balloon.target), d = balloon.el; if (!r) return;
  const W = d.offsetWidth, H = d.offsetHeight, vw = window.innerWidth, vh = window.innerHeight, gap = 14, m = 16;
  const tail = d.querySelector(".balloon__tail");
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let side;
  if (balloon.side === "right" && r.right + gap + W < vw - m) side = "right";
  else if (r.bottom + gap + H < vh - 90) side = "below";
  else if (r.top - gap - H > 60) side = "above";
  else side = r.right + gap + W < vw - m ? "right" : "left";
  let x, y;
  if (side === "below" || side === "above") {
    x = Math.max(m, Math.min(cx - W / 2, vw - W - m));
    y = side === "below" ? r.bottom + gap : r.top - gap - H;
    tail.style.left = Math.max(22, Math.min(cx - x - 8, W - 38)) + "px"; tail.style.top = side === "below" ? "-8px" : ""; tail.style.bottom = side === "above" ? "-8px" : "";
  } else {
    x = side === "right" ? r.right + gap : r.left - gap - W;
    y = Math.max(m + 52, Math.min(cy - H / 2, vh - H - m));
    tail.style.top = Math.max(18, Math.min(cy - y - 8, H - 34)) + "px"; tail.style.left = side === "right" ? "-8px" : ""; tail.style.right = side === "left" ? "-8px" : "";
  }
  d.className = `balloon balloon--${side}`;
  d.style.left = Math.round(x) + "px"; d.style.top = Math.round(y) + "px";
}
function markFound(id, on) { el(id)?.classList.toggle("cua-found", on); }
function markCaptured(id, on) { const e = el(id); if (!e) return; e.classList.toggle("cap", on); e.classList.toggle("cap--above", on && id.startsWith("l-")); if (on) e.dataset.cap = "Captured element"; }

/* ---------------- run control (pause / stop aware) ---------------- */
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const gate = () => paused ? new Promise((r) => waiters.push(r)) : Promise.resolve();
const wait = async (ms) => { await sleep(ms); await gate(); };
const dead = (id) => stopped || id !== runId;
const waitNext = () => new Promise((r) => { nextResolve = r; });
function clickNext() { const r = nextResolve; nextResolve = null; r && r(); }
function setPhase(p) { S.phase = p; const ph = $(".ctl__phase"); if (ph) { ph.textContent = p; ph.title = p; } }

function requestStop() {
  paused = true;
  const scrim = document.createElement("div"); scrim.className = "scrim";
  const m = document.createElement("div"); m.className = "ccard ccard--center is-modal";
  m.innerHTML = `<div class="ccard__head"><h3 class="ccard__title">Stop returning to the flow?</h3></div>
    <p class="ccard__body">If you stop now, your guide won't reconnect and you'll stay on the current step.</p>
    <div class="ccard__actions"><button class="cbtn cbtn--text" data-a="stop">Stop</button><button class="cbtn" data-a="go">Continue returning</button></div>`;
  overlay.append(scrim, m);
  const close = () => { scrim.remove(); m.remove(); };
  m.querySelector('[data-a="go"]').onclick = () => { close(); paused = false; const w = waiters; waiters = []; w.forEach((f) => f()); };
  m.querySelector('[data-a="stop"]').onclick = () => { close(); stopped = true; paused = false; const w = waiters; waiters = []; w.forEach((f) => f()); clearOverlays(); setPhase("stopped by user"); };
}
function clearOverlays() {
  hideBalloon(); hideCursor(); card(); setGlow(false);
  document.querySelectorAll(".cua-found,.cap").forEach((e) => e.classList.remove("cua-found", "cap", "cap--above"));
}
function reset({ keepMin = false, keep = null } = {}) {
  runId++; stopped = true; paused = false;
  const w = waiters; waiters = []; w.forEach((f) => f());
  if (nextResolve) { const r = nextResolve; nextResolve = null; r(); }
  overlay.innerHTML = ""; clearOverlays();
  S.running = false; if (!keepMin) S.min = false; buildPage(keep); setPhase("idle"); renderControls();
}

/* ---------------- the flow ---------------- */
async function run() {
  reset();
  await sleep(60);
  const id = runId; stopped = false; S.running = true; S.min = true; renderControls();
  const sc = SCENARIOS[S.uc];

  // 1) Step 1 balloon
  setPhase("1 · step 1 balloon");
  showBalloon(sc.step1);
  await waitNext(); if (dead(id)) return;
  hideBalloon();

  const step2 = sc.step2(S.prio);

  // ORIGINAL: the captured element is in place — the SWT scrolls to it and shows step 2
  if (S.mode === "orig") {
    setPhase("2 · captured element found");
    const r = rectOf(step2.target), vh = window.innerHeight;
    if (!r) { setPhase("2 · captured element not in page (uncheck Lazy load)"); return; }
    if (r.top < stickTop() + 80 || r.bottom > vh - 160) {
      scroller.scrollTo({ top: scroller.scrollTop + r.top - vh * 0.45, behavior: "smooth" });
      await wait(900); if (dead(id)) return;
    } else { await wait(400); if (dead(id)) return; }
    markCaptured(step2.target, true);
    showBalloon(step2);
    await waitNext(); if (dead(id)) return;
    markCaptured(step2.target, false); hideBalloon(); setPhase("done"); return;
  }

  // Step 2 cannot be found — wait 3 seconds before self-healing starts
  setPhase("2 · step 2 not found (waiting 3s)");
  await wait(TIMING.STUCK); if (dead(id)) return;
  if (S.mode === "off") { setPhase("2 · not found → guide stops (no healing)"); return; }

  // 3a) Something went wrong
  setGlow(true);
  setPhase("3a · back on track");
  card("center", "Something went wrong. Trying to get back on track…");
  await wait(TIMING.CARD_A); if (dead(id)) return;

  // 3b) Finding your next step + Thinking cursor
  setPhase("3b · finding next step");
  card("center", "Finding your next step");
  const cr = $("#overlay .ccard").getBoundingClientRect();
  cursor(cr.left + cr.width * 0.36, cr.bottom + 20, "Thinking", true);
  await wait(TIMING.CARD_B); if (dead(id)) return;

  // 3c) Returning to the original flow (+ scrolling / scanning)
  setPhase("3c · returning");
  card("bl", "Returning to the original flow");
  const ok = await HUNT[S.uc](id, step2.target); if (!ok || dead(id)) return;

  // 3d) Reconnecting on the recovered element
  setPhase("3d · reconnecting");
  cursorToEl(step2.target, "Reconnecting", true);
  await wait(TIMING.CURSOR); if (dead(id)) return;
  markFound(step2.target, true);
  await wait(TIMING.RECONNECT); if (dead(id)) return;

  // 3e) Hand back to the SWT — only the "lost" element + its balloon
  setPhase("3e · step 2 restored");
  markFound(step2.target, false); hideCursor(); card(); setGlow(false);
  await wait(250); if (dead(id)) return;
  showBalloon(step2);
  await waitNext(); if (dead(id)) return;
  hideBalloon(); setPhase("done");
}

const HUNT = {
  // Lazy-loaded cards: scroll only, wait for each card, stop when the target is in view
  async scroll(id, target) {
    const vw = window.innerWidth, vh = window.innerHeight;
    cursor(vw * 0.62, vh * 0.56, "Scrolling");
    await wait(TIMING.CURSOR); if (dead(id)) return false;
    let guard = 0;
    while (guard++ < 4000) {
      if (dead(id)) return false;
      await gate();
      const r = rectOf(target);
      const max = scroller.scrollHeight - scroller.clientHeight;
      if (r && r.top < vh * 0.5) break;
      if (S.loading) { await sleep(60); continue; }
      if (scroller.scrollTop >= max - 1) {
        if (S.loaded.length < SECTION_ORDER.length) { maybeLoadMore(); await sleep(80); continue; }
        break;
      }
      scroller.scrollTop += 9;
      await sleep(16);
    }
    return true;
  },
  // French UI: scan the visible field labels until one matches by meaning
  // French UI: no scanning — the agent keeps "Thinking", then reconnects on the matched field
  async lang(id) { await wait(TIMING.THINK); return !dead(id); },
  // Table: read the header, follow the column, pick the cell per the prompt priority
  // Table: no scanning — "Thinking", then reconnect on the cell the prompt asks for
  async table(id) { await wait(TIMING.THINK); return !dead(id); },
};

/* ---------------- page-state toggles ---------------- */
function renderToggles() {
  document.querySelectorAll("#toggles [data-flag]").forEach((c) => c.checked = !!S.flags[c.dataset.flag]);
}
document.querySelectorAll("#toggles [data-flag]").forEach((c) => c.onchange = () => {
  S.flags[c.dataset.flag] = c.checked;
  try { localStorage.setItem(FLAGS_KEY, JSON.stringify(S.flags)); } catch (e) {}
  // only the matching use case's State changes: checked = self-healing On, unchecked = Original
  const uc = Object.keys(FLAG_OF_UC).find((k) => FLAG_OF_UC[k] === c.dataset.flag);
  S.modes[uc] = c.checked ? "on" : "orig";
  reset({ keepMin: true, keep: currentPosition() });
});

/* ---------------- presenter controls ---------------- */
function renderControls() {
  const idle = !S.running;
  const sc = SCENARIOS[S.uc];
  $("#ctl").className = "ctl" + (S.min ? " is-min" : "");
  $("#ctl").innerHTML = `
    <div class="ctl__bar"><span class="ctl__label">Demo · ${sc.swtName}</span><span class="ctl__phase" title="${S.phase}">${S.phase}</span>
      <button class="ctl__icon" data-a="min" title="Hide / show (H)">${S.min ? "▴" : "▾"}</button></div>
    <div class="ctl__body">
      <div class="ctl__row"><span class="ctl__label">Use case</span>
        <div class="seg">${Object.entries(SCENARIOS).map(([k, v]) => `<button data-uc="${k}" class="${S.uc === k ? "is-on" : ""}">${v.short}</button>`).join("")}</div></div>
      <div class="ctl__row"><span class="ctl__label">State</span>
        <div class="seg">${[["orig", "Original"], ["off", "Off: SWT breaks"], ["on", "On: self-healing"]].map(([k, l]) => `<button data-mode="${k}" class="${S.mode === k ? "is-on" : ""}">${l}</button>`).join("")}</div></div>
      ${S.uc === "table" ? `<div class="ctl__row"><span class="ctl__label">Step prompt priority</span>
        <div class="seg"><button data-prio="location" class="${S.prio === "location" ? "is-on" : ""}">Location (first cell)</button><button data-prio="text" class="${S.prio === "text" ? "is-on" : ""}">Text ("Hire")</button></div></div>` : ""}
      <div class="notes">${S.mode === "orig" ? sc.captured(S.prio) : sc.notes(S.prio)}</div>
      <button class="ctl__run ${idle ? "" : "is-restart"}" data-a="${idle ? "run" : "reset"}">${idle ? "▶ Run" : "↻ Restart"}</button>
      <div class="kbd">Keys: R run/restart · Space = balloon button · 1/2/3 use case · O/F/N original/off/on · H hide panel</div>
    </div>`;
  $("#ctl").querySelectorAll("[data-uc]").forEach((b) => b.onclick = () => { S.uc = b.dataset.uc; reset(); });
  $("#ctl").querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => { S.mode = b.dataset.mode; reset(); });
  $("#ctl").querySelectorAll("[data-prio]").forEach((b) => b.onclick = () => { S.prio = b.dataset.prio; reset(); });
  $("#ctl").querySelector('[data-a="min"]').onclick = () => { S.min = !S.min; renderControls(); };
  const rb = $("#ctl").querySelector(".ctl__run"); rb.onclick = () => rb.dataset.a === "run" ? run() : reset();
}
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input,textarea")) return;
  if (e.key === " " || e.key === "Enter") { if (nextResolve) { e.preventDefault(); clickNext(); } }
  else if (e.key === "r" || e.key === "R") { !S.running ? run() : reset(); }
  else if (e.key === "h" || e.key === "H") { S.min = !S.min; renderControls(); }
  else if ("ofnOFN".includes(e.key) && e.key.length === 1) { S.mode = { o: "orig", f: "off", n: "on" }[e.key.toLowerCase()]; reset(); }
  else if (["1", "2", "3"].includes(e.key)) { S.uc = ["scroll", "lang", "table"][+e.key - 1]; reset(); }
});

document.fonts?.ready.then(() => { updateStick(); spy(); });
reset({ keepMin: true });
</script>
</body>
